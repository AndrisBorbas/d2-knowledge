name: Refresh data

# Pulls fresh data from the Compendium sheet, Clarity, the Aegis sheets and the
# Bungie manifest, checks that the site still builds with it, and pushes the new
# snapshots to main. The push is what makes Cloudflare rebuild and deploy the
# site, so no extra deploy step is needed when something changed.
#
# A manual run works on whichever branch it is started from, so a branch that
# changes what gets fetched can fill in its own snapshot. The schedule always
# runs on the default branch.
on:
  schedule:
    # Tuesdays at 18:00 UTC, an hour after the weekly Destiny reset, when
    # patches and manifest changes land.
    - cron: "0 18 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # The build copies icons out of the destiny-icons submodule and
          # fails on CI when it is missing.
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh data snapshots
        run: bun run data:compile
        env:
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          AUTH_BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}

      # Every snapshot stores a generatedAt timestamp, so the files always
      # differ. Ignore those lines to find out whether any real data changed.
      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet -I'[gG]eneratedAt' -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only timestamps changed, skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -I'[gG]eneratedAt' -- data
          fi

      # A renamed sheet tab or a changed manifest shape can break the site.
      # Build before committing so bad data never reaches main.
      - name: Build site with the new data
        if: steps.changes.outputs.changed == 'true'
        run: bun run build

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "update data"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      # When the data did not change there is no push to trigger Cloudflare,
      # so ask it for a rebuild directly. Optional: skipped if the secret is
      # not set. Only on the default branch, since the hook rebuilds production.
      - name: Trigger Cloudflare rebuild
        if: steps.changes.outputs.changed == 'false' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL is not set, skipping rebuild."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
